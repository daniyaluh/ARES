{% extends 'base.html' %}
{% load static %}

{% block title %}Sign up - ARES{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-200px)] flex items-center justify-center py-12">
    <div class="w-full max-w-sm mx-auto px-6">
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="w-12 h-12 bg-white rounded-xl flex items-center justify-center mx-auto mb-4">
                <svg class="w-7 h-7 text-linear-bg" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            </div>
            <h1 class="text-2xl font-semibold text-white mb-2">Create your account</h1>
            <p class="text-sm text-linear-text-tertiary">Get started with ARES today</p>
        </div>
        
        <!-- Register Form -->
        <div class="card p-6">
            <form method="post" class="space-y-4">
                {% csrf_token %}
                
                <div>
                    <label for="email" class="block text-sm font-medium text-linear-text-secondary mb-1.5">Email</label>
                    <input type="email" id="email" name="email" required placeholder="you@company.com" class="w-full">
                </div>
                
                <div>
                    <label for="username" class="block text-sm font-medium text-linear-text-secondary mb-1.5">Username</label>
                    <input type="text" id="username" name="username" required placeholder="johndoe" class="w-full">
                </div>
                
                <div>
                    <label for="password" class="block text-sm font-medium text-linear-text-secondary mb-1.5">Password</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••" class="w-full">
                </div>
                
                <div>
                    <label for="password2" class="block text-sm font-medium text-linear-text-secondary mb-1.5">Confirm password</label>
                    <input type="password" id="password2" name="password2" required placeholder="••••••••" class="w-full">
                </div>
                
                <button type="submit" class="btn-primary w-full py-2.5 text-sm">
                    Create account
                </button>
            </form>
            
            <p class="mt-4 text-center text-sm text-linear-text-tertiary">
                Already have an account? <a href="{% url 'users:login' %}" class="text-white hover:text-linear-text-secondary transition-colors">Sign in</a>
            </p>
        </div>
        
        <p class="mt-6 text-center text-xs text-linear-text-tertiary">
            By creating an account, you agree to our <a href="#" class="text-linear-text-secondary hover:text-white transition-colors">Terms</a> and <a href="#" class="text-linear-text-secondary hover:text-white transition-colors">Privacy Policy</a>
        </p>
    </div>
</div>
{% endblock %}
