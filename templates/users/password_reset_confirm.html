{% extends 'base.html' %}
{% load static %}

{% block title %}Password Reset Confirm - ARES{% endblock %}

{% block content %}
<div class="min-h-screen bg-gradient-to-br from-deep-slate via-slate-850 to-deep-slate py-12">
    <div class="max-w-md mx-auto px-4 sm:px-6 lg:px-8">
        <div class="glass-effect cyber-border rounded-lg p-8">
            <h1 class="text-3xl font-bold text-cyber-lime mb-2 font-mono text-center">PASSWORD RESET</h1>
            <p class="text-slate-400 text-sm text-center mb-8 font-mono">Confirm your new password</p>
            
            <div class="text-center text-slate-400">
                <p>Password reset functionality coming soon.</p>
                <a href="{% url 'users:login' %}" class="text-cyber-lime hover:underline mt-4 inline-block">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
